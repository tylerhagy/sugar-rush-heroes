<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sugar Rush">
<meta name="theme-color" content="#2a1640">
<title>Sugar Rush Heroes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #2a1640;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: Fredoka, "Arial Rounded MT Bold", sans-serif;
  }
  #game { position: absolute; display: block; border-radius: 6px; }
  #touch { position: fixed; inset: 0; display: none; z-index: 5; }
  #touch.show { display: block; }
  .tb {
    position: absolute; box-sizing: border-box;
    width: 78px; height: 78px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    border: 3px solid rgba(255,255,255,.7);
    color: #fff; font-weight: 700; font-size: 14px; letter-spacing: .5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-shadow: 0 2px 2px rgba(0,0,0,.45);
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
    pointer-events: none;
  }
  .tb b { font-size: 30px; line-height: 1; }
  .tb.on { background: rgba(255,255,255,.6); transform: scale(.93); }
  #bL { left: max(16px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); }
  #bR { left: calc(max(16px, env(safe-area-inset-left)) + 96px); bottom: max(18px, env(safe-area-inset-bottom)); }
  #bJ { right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 96px; height: 96px; background: rgba(255,120,190,.35); }
  #bP { right: calc(max(16px, env(safe-area-inset-right)) + 110px); bottom: max(18px, env(safe-area-inset-bottom)); background: rgba(150,110,255,.35); }
  #bS { right: calc(max(16px, env(safe-area-inset-right)) + 22px); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 112px); width: 60px; height: 60px; }
  #bS b { font-size: 24px; }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 6; display: flex; gap: 8px; }
  .hb {
    width: 46px; height: 46px; border-radius: 14px; border: 3px solid rgba(255,255,255,.8);
    background: rgba(60,20,90,.55); color: #fff; font-size: 22px; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .hb.hide { display: none; }
  #rotateHint { display: none; position: fixed; left: 0; right: 0; text-align: center; color: #ffd1e8; font-weight: 600; font-size: 17px; pointer-events: none; }
  body.portrait #rotateHint { display: block; }
  body.portrait #bP { right: calc(max(16px, env(safe-area-inset-right)) + 9px); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 112px); }
  body.portrait #bS { right: calc(max(16px, env(safe-area-inset-right)) + 112px); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 120px); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotateHint">📱 Turn your phone sideways for a BIGGER game!</div>
<div id="touch">
  <div class="tb" id="bL" data-k="left"><b>◀</b></div>
  <div class="tb" id="bR" data-k="right"><b>▶</b></div>
  <div class="tb" id="bP" data-k="power"><b id="powIcon">🦇</b><span id="powLabel">POWER</span></div>
  <div class="tb" id="bS" data-k="swap"><b>🔄</b></div>
  <div class="tb" id="bJ" data-k="jump"><b>⬆</b>JUMP</div>
</div>
<div id="hud">
  <button class="hb hide" id="pauseBtn" aria-label="Pause">⏸</button>
  <button class="hb" id="muteBtn" aria-label="Sound on or off">🔊</button>
</div>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
